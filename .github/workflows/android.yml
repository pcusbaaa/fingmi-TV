name: Android CI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "fongmi" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build with Gradle (skip lint)
      run: ./gradlew assembleRelease -x lint  # 只运行这个构建命令
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-build-apk
        path: |
          ./**/*.apk
          ./**/*.aab
