name: Android CI with Signing

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    # 在这里设置环境变量，确保所有步骤都能访问
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ENCODED_BASE_URL: ${{ secrets.ENCODED_BASE_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Decode Keystore
      run: |
        mkdir -p app/
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/my-release-key.keystore
        echo "Keystore file created"
        ls -la app/my-release-key.keystore
        
    - name: Verify Keystore
      run: |
        # 验证keystore文件是否存在且可访问
        if [ -f "app/my-release-key.keystore" ]; then
          echo "Keystore file exists"
        else
          echo "ERROR: Keystore file not found!"
          exit 1
        fi
        
    - name: Verify ENCODED_BASE_URL
      run: |
        # 验证环境变量是否设置
        if [ -z "$ENCODED_BASE_URL" ]; then
          echo "ERROR: ENCODED_BASE_URL environment variable is not set!"
          exit 1
        else
          echo "ENCODED_BASE_URL is set (length: ${#ENCODED_BASE_URL})"
          # 只显示前10个字符用于验证，不显示完整内容
          echo "ENCODED_BASE_URL preview: ${ENCODED_BASE_URL:0:10}..."
        fi
        
    - name: Build signed Release APK
      run: |
        # 打印环境变量用于调试
        echo "KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:0:2}******"  # 只显示前2位
        echo "KEY_ALIAS: $KEY_ALIAS"
        echo "KEY_PASSWORD: ${KEY_PASSWORD:0:2}******"  # 只显示前2位
        echo "ENCODED_BASE_URL: ${ENCODED_BASE_URL:0:10}..."  # 只显示前10位
        
        # 构建命令
        ./gradlew assembleRelease -x lint --info
        
    - name: List generated APKs
      run: |
        find . -name "*.apk" -type f -exec ls -la {} \;
        
    # 创建目录并移动所有APK文件到根目录
    - name: Prepare APKs for upload
      run: |
        # 创建临时目录存放所有APK文件
        mkdir -p apk-artifacts
        
        # 查找并复制所有APK文件到临时目录
        find . -name "*.apk" -type f -exec cp {} apk-artifacts/ \;
        
        # 显示移动后的文件列表
        echo "APK files prepared for upload:"
        ls -la apk-artifacts/
        
    # 上传签名的APK
    - name: Upload signed APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-apk-${{ github.run_number }}
        path: apk-artifacts/
        if-no-files-found: error